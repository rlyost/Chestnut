s:"Personal bilingue"}},b={title:{en:"What We Do",es:"Lo Que Hacemos"},sub:{en:"Full-service auto repair and towing for drivers across Redwood City, Palo Alto, San Mateo, San Carlos, Menlo Park, and the entire Peninsula.",es:"Reparacion de autos y remolque de servicio completo para conductores en Redwood City, Palo Alto, San Mateo, San Carlos, Menlo Park y toda la Peninsula."},showMore:{en:"Show All Services",es:"Mostrar Todos los Servicios"},showLess:{en:"Show Fewer Services",es:"Mostrar Menos Servicios"},items:[{name:{en:"Oil Change",es:"Cambio de Aceite"},desc:{en:"One of the simplest and most affordable ways to extend the life of your vehicle. We select the right oil type for your car and perform a thorough inspection with every service.",es:"Una de las formas mas simples y economicas de extender la vida de su vehiculo. Seleccionamos el tipo de aceite adecuado para su auto y realizamos una inspeccion completa con cada servicio."}},{name:{en:"Brake Service",es:"Servicio de Frenos"},desc:{en:"Pads, rotors, calipers, and complete brake system inspections. Your safety is never optional. We service brakes on all makes and models.",es:"Pastillas, rotores, calibradores e inspecciones completas del sistema de frenos. Su seguridad nunca es opcional. Damos servicio a frenos de todas las marcas y modelos."}},{name:{en:"Engine Repair & Diagnostics",es:"Reparacion y Diagnostico de Motor"},desc:{en:"Check engine light on? We use advanced diagnostic tools to pinpoint the issue and fix it right the first time. From minor tune-ups to major engine repair.",es:"Se encendio la luz del motor? Usamos herramientas de diagnostico avanzadas para identificar el problema y repararlo correctamente la primera vez. Desde afinaciones menores hasta reparaciones mayores de motor."}},{name:{en:"Transmission Repair & Service",es:"Reparacion y Servicio de Transmision"},desc:{en:"Fluid changes, rebuilds, and complete transmission diagnostics. We work on both automatic and manual transmissions for all vehicle types.",es:"Cambios de fluido, reconstrucciones y diagnosticos completos de transmision. Trabajamos con transmisiones automaticas y manuales para todo tipo de vehiculo."}},{name:{en:"Auto A/C Repair & Service",es:"Reparacion y Servicio de Aire Acondicionado"},desc:{en:"Stay comfortable year-round. Full AC diagnostics, recharging, compressor repair, and complete climate system service for all makes and models.",es:"Mantengase comodo todo el ano. Diagnosticos completos de AC, recargas, reparacion de compresor y servicio completo del sistema climatico para todas las marcas y modelos."}},{name:{en:"Tire Services",es:"Servicios de Llantas"},desc:{en:"New tires from trusted brands like Goodyear, Mastercraft, and Advanta. Rotations, balancing, flat repair, and precision alignment to extend tire life.",es:"Llantas nuevas de marcas de confianza como Goodyear, Mastercraft y Advanta. Rotaciones, balanceo, reparacion de ponchadura y alineacion de precision para extender la vida de las llantas."}},{name:{en:"Towing Services",es:"Servicios de Remolque"},desc:{en:"Stuck on the road in Redwood City, Palo Alto, or San Mateo? Our experienced drivers handle everything from coupes and sedans to SUVs and trucks. We tow directly to our shop.",es:"Varado en el camino en Redwood City, Palo Alto o San Mateo? Nuestros conductores experimentados manejan desde coupes y sedanes hasta SUVs y camionetas. Remolcamos directamente a nuestro taller."}},{name:{en:"Electrical Systems",es:"Sistemas Electricos"},desc:{en:"Batteries, alternators, starters, wiring, and full electrical diagnostics. Modern cars are computers on wheels and we speak the language.",es:"Baterias, alternadores, arrancadores, cableado y diagnosticos electricos completos. Los autos modernos son computadoras sobre ruedas y hablamos el idioma."}},{name:{en:"Suspension Repair",es:"Reparacion de Suspension"},desc:{en:"Shocks, struts, ball joints, control arms, and complete suspension system service. Restore your ride quality and handling to like-new condition.",es:"Amortiguadores, puntales, rotulas, brazos de control y servicio completo del sistema de suspension. Restaure la calidad de manejo de su vehiculo."}},{name:{en:"4x4 Service & Repair",es:"Servicio y Reparacion 4x4"},desc:{en:"Specialized service for four-wheel drive vehicles. Transfer case repair, differential service, and drivetrain maintenance with state-of-the-art equipment.",es:"Servicio especializado para vehiculos de traccion en las cuatro ruedas. Reparacion de caja de transferencia, servicio de diferencial y mantenimiento de tren motriz con equipo de ultima generacion."}},{name:{en:"Diesel Repair & Service",es:"Reparacion y Servicio Diesel"},desc:{en:"Expert diesel maintenance and repair for trucks, SUVs, and commercial vehicles. Fuel system service, turbo repair, and diesel-specific diagnostics.",es:"Mantenimiento y reparacion experta de diesel para camionetas, SUVs y vehiculos comerciales. Servicio de sistema de combustible, reparacion de turbo y diagnosticos especificos de diesel."}},{name:{en:"Vehicle Inspection",es:"Inspeccion de Vehiculos"},desc:{en:"Pre-purchase inspections, safety inspections, and multi-point vehicle assessments. Know exactly what you are buying or what your car needs.",es:"Inspecciones de pre-compra, inspecciones de seguridad y evaluaciones de vehiculos de multiples puntos. Sepa exactamente lo que esta comprando o lo que su auto necesita."}},{name:{en:"Heating & Cooling",es:"Calefaccion y Enfriamiento"},desc:{en:"Radiator service, coolant flushes, thermostat replacement, heater core repair, and complete cooling system diagnostics to prevent overheating.",es:"Servicio de radiador, lavados de refrigerante, reemplazo de termostato, reparacion de nucleo de calefaccion y diagnosticos completos del sistema de enfriamiento para prevenir sobrecalentamiento."}},{name:{en:"Steering Service",es:"Servicio de Direccion"},desc:{en:"Power steering repair, rack and pinion service, tie rod replacement, and wheel alignment. Keep your vehicle tracking straight and handling safely.",es:"Reparacion de direccion hidraulica, servicio de cremallera y pinon, reemplazo de bieletas y alineacion de ruedas. Mantenga su vehiculo manejando recto y con seguridad."}},{name:{en:"Exhaust & Muffler",es:"Escape y Mofle"},desc:{en:"Muffler replacement, catalytic converter service, exhaust pipe repair, and complete exhaust system inspection to keep your vehicle running clean and quiet.",es:"Reemplazo de mofle, servicio de convertidor catalitico, reparacion de tubos de escape e inspeccion completa del sistema de escape para mantener su vehiculo funcionando limpio y silencioso."}},{name:{en:"DMV Vehicle Registration",es:"Registro Vehicular del DMV"},desc:{en:"Skip the DMV line. We handle vehicle registration renewals, smog checks, and related paperwork right here at our shop. Fast and convenient.",es:"Evite la fila del DMV. Manejamos renovaciones de registro vehicular, verificaciones de smog y tramites relacionados aqui mismo en nuestro taller. Rapido y conveniente."}}]},S={title:{en:"Our Story",es:"Nuestra Historia"},p1:{en:"Chestnut Auto & Towing opened its doors in 1989 on Chestnut Street in Redwood City. What started as a small family garage has grown into a full-service auto repair and towing shop trusted by thousands of families across the Peninsula.",es:"Chestnut Auto & Towing abrio sus puertas en 1989 en la calle Chestnut en Redwood City. Lo que comenzo como un pequeno taller familiar ha crecido hasta convertirse en un taller de servicio completo de reparacion de autos y remolque en el que confian miles de familias en toda la Peninsula."},p2:{en:"We believe car repair should be straightforward. You bring in your car, we tell you what it needs, we fix it at a fair price, and we stand behind the work. That philosophy has kept customers from Redwood City, Palo Alto, San Mateo, and beyond coming back for over 35 years.",es:"Creemos que la reparacion de autos debe ser directa. Usted trae su auto, le decimos lo que necesita, lo reparamos a un precio justo y respaldamos el trabajo. Esa filosofia ha mantenido a los clientes de Redwood City, Palo Alto, San Mateo y mas alla regresando por mas de 35 anos."},p3:{en:"Our bilingual team serves the entire community. Whether you speak English or Spanish, you will be understood, respected, and taken care of.",es:"Nuestro equipo bilingue sirve a toda la comunidad. Ya sea que hable ingles o espanol, sera entendido, respetado y atendido."},stat1Label:{en:"Years in Business",es:"Anos en el Negocio"},stat2Label:{en:"Happy Customers",es:"Clientes Satisfechos"},stat3Label:{en:"Yelp Reviews",es:"Resenas en Yelp"}},M={title:{en:"Our Work",es:"Nuestro Trabajo"},sub:{en:"Quality you can see. From engine rebuilds to brake jobs, here is a sample of what comes through our shop.",es:"Calidad que se puede ver. Desde reconstrucciones de motor hasta trabajos de frenos, aqui hay una muestra de lo que pasa por nuestro taller."}},E={title:{en:"What Our Customers Say",es:"Lo Que Dicen Nuestros Clientes"},sub:{en:"255+ reviews and counting. Drivers from Redwood City to Palo Alto trust Chestnut Auto & Towing.",es:"255+ resenas y contando. Conductores de Redwood City a Palo Alto confian en Chestnut Auto & Towing."},items:[{name:"Maria G.",text:{en:"I have been bringing my cars here for over 10 years. They are honest, fair, and they always explain what needs to be done. The bilingual staff is a huge plus for my family.",es:"He traido mis autos aqui por mas de 10 anos. Son honestos, justos y siempre explican lo que se necesita hacer. El personal bilingue es una gran ventaja para mi familia."},stars:5},{name:"David K.",text:{en:"Best independent shop on the Peninsula. I drive from Palo Alto because their work is consistently excellent. Fair prices, no surprises.",es:"El mejor taller independiente en la Peninsula. Manejo desde Palo Alto porque su trabajo es consistentemente excelente. Precios justos, sin sorpresas."},stars:5},{name:"Jennifer T.",text:{en:"They towed my car when it broke down on El Camino. Had it diagnosed and fixed the same day. That kind of service is rare.",es:"Remolcaron mi auto cuando se descompuso en El Camino. Lo diagnosticaron y repararon el mismo dia. Ese tipo de servicio es raro."},stars:5},{name:"Roberto M.",text:{en:"Best mechanic in Redwood City. My whole family comes here. They treat you like family too. Open 7 days which is a lifesaver for my work schedule.",es:"El mejor mecanico en Redwood City. Toda mi familia viene aqui. Te tratan como familia tambien. Abierto 7 dias lo cual es un salvavidas para mi horario de trabajo."},stars:5}]},f={title:{en:"Get in Touch",es:"Contactenos"},sub:{en:"Walk in, call, or fill out the form. We serve Redwood City, Palo Alto, San Mateo, San Carlos, Menlo Park, Atherton, Woodside, and the surrounding areas.",es:"Venga en persona, llame o llene el formulario. Servimos a Redwood City, Palo Alto, San Mateo, San Carlos, Menlo Park, Atherton, Woodside y las areas cercanas."},name:{en:"Your Name",es:"Su Nombre"},email:{en:"Email",es:"Correo Electronico"},phone:{en:"Phone",es:"Telefono"},vehicle:{en:"Vehicle (Year, Make, Model)",es:"Vehiculo (Ano, Marca, Modelo)"},message:{en:"What do you need help with?",es:"En que podemos ayudarle?"},submit:{en:"Send Message",es:"Enviar Mensaje"},hoursTitle:{en:"Business Hours",es:"Horario de Trabajo"},addressTitle:{en:"Location",es:"Ubicacion"}},x={tagline:{en:"Honest auto repair and towing for Redwood City and the Peninsula since 1989.",es:"Reparacion honesta de autos y remolque para Redwood City y la Peninsula desde 1989."},rights:{en:"All rights reserved.",es:"Todos los derechos reservados."}},Q="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDM3IiBoZWlnaHQ9IjI5MyIgdmlld0JveD0iMCAwIDQzNyAyOTMiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyIgeG1sbnM6eGxpbms9Imh0dHA6Ly93d3cudzMub3JnLzE5OTkveGxpbmsiPgo8cmVjdCB3aWR0aD0iNDM3IiBoZWlnaHQ9IjI5MyIgZmlsbD0idXJsKCNwYXR0ZXJuMF81MzJfMjM1NCkiLz4KPGRlZnM+CjxwYXR0Z
